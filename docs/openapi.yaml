openapi: 3.0.3
info:
  title: MediTurno 2.0 — ms-reservas
  version: "1.0.0"
  description: >
    Ciclo de vida de reservas de hora médica. La especificación funcional son las
    reglas RN-RES-01 a RN-RES-10 del Documento 1 del curso; este archivo describe
    la forma del contrato HTTP, no el comportamiento correcto.
servers:
  - url: http://localhost:8082

paths:
  /api/reservas:
    get:
      summary: Lista reservas, opcionalmente filtradas por RUT
      parameters:
        - in: query
          name: rut
          schema: { type: string }
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reserva" }
    post:
      summary: Crea una reserva en estado BORRADOR (o EN_ESPERA si el bloque está ocupado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearReserva" }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "400": { description: Entrada inválida o regla de calendario/anticipación, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Paciente inexistente, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Conflicto con el estado del sistema, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/reservas/{id}:
    get:
      summary: Detalle de una reserva
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Detalle, content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "404": { description: No existe, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Cambia la fecha y hora de la reserva (RN-RES-09)
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fechaHoraAtencion]
              properties:
                fechaHoraAtencion: { type: string, format: date-time }
      responses:
        "200": { description: Modificada, content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "400": { description: Entrada inválida }
        "409": { description: Tope de modificaciones, estado incompatible o bloque sin cupo }

  /api/reservas/{id}/confirmar:
    post:
      summary: BORRADOR o EN_ESPERA -> CONFIRMADA
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Confirmada, content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "409": { description: Transición no permitida }

  /api/reservas/{id}/iniciar:
    post:
      summary: CONFIRMADA -> EN_CURSO
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: En curso }
        "409": { description: Transición no permitida }

  /api/reservas/{id}/finalizar:
    post:
      summary: EN_CURSO -> ATENDIDA
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Atendida }
        "409": { description: Transición no permitida }

  /api/reservas/{id}/anular:
    post:
      summary: Anula la reserva y calcula la multa (RN-RES-05 a RN-RES-07)
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Anulada, content: { application/json: { schema: { $ref: "#/components/schemas/Reserva" } } } }
        "409": { description: Transición no permitida }

  /api/reservas/{id}/inasistencia:
    post:
      summary: Marca la inasistencia del paciente (RN-RES-07 y RN-RES-08)
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Marcada }
        "409": { description: Transición no permitida }

  /api/pacientes:
    get:
      summary: Padrón de pacientes
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Paciente" }
    post:
      summary: Registra un paciente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearPaciente" }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Paciente" } } } }
        "400": { description: Entrada inválida }
        "409": { description: RUT ya registrado }

components:
  parameters:
    RelojSimulado:
      in: header
      name: X-Reloj-Simulado
      required: false
      schema: { type: string, format: date-time }
      description: >
        Fija la hora del servicio para esta petición. Solo afecta a la petición que
        la lleva, de modo que la suite puede ejecutarse en paralelo.
  schemas:
    Reserva:
      type: object
      required: [id, rutPaciente, especialidad, fechaHoraAtencion, canal, estado,
                 arancelBruto, copago, multa, modificaciones]
      properties:
        id: { type: integer, format: int64 }
        rutPaciente: { type: string }
        especialidad: { type: string, enum: [MEDICINA_GENERAL, NUTRICION, PEDIATRIA, CARDIOLOGIA, PSIQUIATRIA] }
        fechaHoraAtencion: { type: string, format: date-time }
        canal: { type: string, enum: [WEB, APP_MOVIL, CALL_CENTER, PRESENCIAL] }
        estado: { type: string, enum: [BORRADOR, EN_ESPERA, CONFIRMADA, EN_CURSO, ATENDIDA, ANULADA, NO_ASISTIDA] }
        arancelBruto: { type: integer, format: int64 }
        copago: { type: integer, format: int64 }
        multa: { type: integer, format: int64 }
        modificaciones: { type: integer }
    CrearReserva:
      type: object
      required: [rutPaciente, especialidad, fechaHoraAtencion, canal]
      properties:
        rutPaciente: { type: string, maxLength: 15 }
        especialidad: { type: string }
        fechaHoraAtencion: { type: string, format: date-time }
        canal: { type: string }
        aceptaListaEspera: { type: boolean, default: false }
    Paciente:
      type: object
      required: [rut, nombre, fechaNacimiento, prevision, convenioEmpresa]
      properties:
        rut: { type: string }
        nombre: { type: string }
        fechaNacimiento: { type: string, format: date }
        prevision: { type: string, enum: [FONASA, ISAPRE, PARTICULAR] }
        tramoFonasa: { type: string, nullable: true, enum: [A, B, C, D] }
        convenioEmpresa: { type: boolean }
    CrearPaciente:
      type: object
      required: [rut, nombre, fechaNacimiento, prevision]
      properties:
        rut: { type: string, maxLength: 15 }
        nombre: { type: string, maxLength: 120 }
        fechaNacimiento: { type: string, format: date }
        prevision: { type: string }
        tramoFonasa: { type: string, nullable: true }
        convenioEmpresa: { type: boolean, default: false }
    Error:
      type: object
      required: [codigo, mensaje, estado, ruta, instante]
      properties:
        codigo: { type: string, example: RES-03-TOPE }
        mensaje: { type: string }
        estado: { type: integer }
        ruta: { type: string }
        instante: { type: string, format: date-time }
